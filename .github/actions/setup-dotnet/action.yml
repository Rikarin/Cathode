name: Set up .NET
description: >
  Installs the .NET SDK that engine/global.json names, from builds.dotnet.microsoft.com, with the official
  dotnet-install script. Used in place of actions/setup-dotnet, whose installs go through aka.ms links to the old
  dotnetorigin storage account, which has refused public downloads since 2026-10-25 (actions/setup-dotnet#794,
  dotnet/core#10660). Go back to the pinned actions/setup-dotnet once that is fixed.

  The install scripts are the copies committed beside this file, so nothing a job executes is fetched unpinned at run
  time: src/dotnet-install.sh and src/dotnet-install.ps1 of https://github.com/dotnet/install-scripts at commit
  ee83f9c42135205be4e0503bd472b6f99c9b7d51 (MIT, unchanged; builds.dotnet.microsoft.com serves the same text, the
  .ps1 with a signature block appended). To update them, copy both files from a newer commit and change the commit
  here.

  The SDK goes into its own folder, ~/.dotnet-sdk, which is cached by OS, CPU, global.json and the scripts: a job
  downloads the SDK only when one of those changed.
runs:
  using: composite
  steps:
    - id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.dotnet-sdk
        key: dotnet-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('engine/global.json', '.github/actions/setup-dotnet/dotnet-install.*') }}
    - if: runner.os != 'Windows'
      shell: bash
      env:
        CACHED: ${{ steps.cache.outputs.cache-hit }}
        ACTION: ${{ github.action_path }}
      run: |
        if [ "$CACHED" != true ]; then
          bash "$ACTION/dotnet-install.sh" --jsonfile engine/global.json --install-dir "$HOME/.dotnet-sdk" \
            --azure-feed https://builds.dotnet.microsoft.com/dotnet
        fi
        echo "DOTNET_ROOT=$HOME/.dotnet-sdk" >> "$GITHUB_ENV"
        echo "$HOME/.dotnet-sdk" >> "$GITHUB_PATH"
    - if: runner.os == 'Windows'
      shell: pwsh
      env:
        CACHED: ${{ steps.cache.outputs.cache-hit }}
        ACTION: ${{ github.action_path }}
      run: |
        $dir = Join-Path $env:USERPROFILE '.dotnet-sdk'
        if ($env:CACHED -ne 'true') {
          & (Join-Path $env:ACTION 'dotnet-install.ps1') -JsonFile engine/global.json -InstallDir $dir `
            -AzureFeed https://builds.dotnet.microsoft.com/dotnet
        }
        "DOTNET_ROOT=$dir" >> $env:GITHUB_ENV
        $dir >> $env:GITHUB_PATH
