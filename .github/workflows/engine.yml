name: engine

on:
  push:
    branches: [master]
  pull_request:
    paths: ["engine/**", ".github/workflows/engine.yml"]
  # release.yml runs these jobs on the tagged commit and publishes only when they pass.
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: engine

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-dotnet
      - name: Cache native dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engine/artifacts/deps
          key: native-deps-${{ hashFiles('engine/native/cth_nam/CMakeLists.txt', 'engine/native/cth_audio/CMakeLists.txt') }}
      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev
      - name: Build native shim
        shell: bash
        run: ./native/build.sh
      - name: Native unit tests
        run: ctest --test-dir artifacts/obj/native -C Release --output-on-failure
      - run: dotnet build Cathode.slnx -c Release
      - run: dotnet test --solution Cathode.slnx -c Release --no-build

  host-aot:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: macos-latest, rid: osx-arm64 }
          - { os: windows-latest, rid: win-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-dotnet
      - name: Cache native dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engine/artifacts/deps
          key: native-deps-${{ hashFiles('engine/native/cth_nam/CMakeLists.txt', 'engine/native/cth_audio/CMakeLists.txt') }}
      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev
      - name: Build native shim
        shell: bash
        run: ./native/build.sh
      - run: dotnet publish src/Cathode.Host -c Release -r "$RID" -o out
        shell: bash
        env:
          RID: ${{ matrix.rid }}
      - name: Self-test (zero allocation, real-time headroom)
        shell: bash
        run: ./out/cathode-host --self-test
