name: release

# A version tag (v1.2.3, or v1.2.3-rc.1 for a prerelease) builds every installer and publishes a GitHub release:
#
# - The desktop app (the editor, Electron and the engine sidecars): a .dmg and .zip for Apple Silicon Macs, an NSIS
#   installer for Windows x64 and an AppImage for Linux x64. Each is started on its runner as packaged and checked: it
#   runs the engine it carries, serves its editor, passes the sidecar tests and leaves nothing running when it quits.
#   The same for Intel Macs, Windows on ARM and ARM64 Linux desktops, built and checked the same way on runners of
#   their own; a release does not wait for those three (docs/10-releases.md, "Desktop targets"). Linux also gets a
#   .deb when the repository variable CATHODE_DEB_MAINTAINER names its maintainer.
# - The headless rig (the engine and server with the web editor, systemd services and an install script) for small
#   Linux computers without a display, x64 and ARM64: cathode-server-<version>-linux-<arch>.tar.gz. Each is installed
#   on its runner and checked: the services start, the web editor loads and the API wants the token.
#
# Every installer builds on its own OS and CPU, since NativeAOT cannot cross-compile. The Linux engine is linked in a
# Debian 12 container (the `linux-engine` job), so the AppImage and the headless rig run on glibc 2.36 and newer, and
# the Linux jobs package that engine (docs/10-releases.md, "The oldest Linux it runs on"). Running the workflow by hand
# builds them all as workflow artifacts without publishing a release; those builds are neither signed nor attested.
#
# Nothing is built for a tag that does not point at a commit on master (the `tag` job, which every build waits for),
# and nothing is published unless the tagged commit passes the same checks as master: engine.yml (the engine tests on
# three OSes and the NativeAOT host's self-test on four targets) and editor.yml (the generated API client, type-check,
# lint, unit tests, Storybook and the Playwright tests of the desktop app) run here as reusable workflows.
#
# Signing is optional. Without secrets, macOS builds are signed ad hoc (Gatekeeper asks users to allow them) and Windows
# builds are unsigned. Set CSC_LINK (base64 .p12) and CSC_KEY_PASSWORD to sign, and on macOS APPLE_ID,
# APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID to notarise. Only a release run (a v* tag on master) passes them to
# the build, and its desktop jobs run in the `release` environment: keep the secrets there, with the environment
# limited to v* tags, and no run from a branch can read them, whatever its copy of this file says
# (docs/10-releases.md, "Signing").

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; only the release job may write (it creates the release).
permissions:
  contents: read

env:
  CATHODE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

jobs:
  # The test gate: the tagged commit's own test workflows. They run beside the builds, and the release waits for both.
  engine:
    uses: ./.github/workflows/engine.yml

  editor:
    uses: ./.github/workflows/editor.yml

  # A release comes from master: a tag on an unmerged branch (or on a commit master has since dropped) is refused, and
  # the builds, which wait for this job, do not start. Its `release` output is 'true' for a v* tag on master and
  # 'false' for a manual run, which builds without the signing secrets, attests nothing and publishes nothing.
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # origin/master and the history to check ancestry against
      - name: The tagged commit is on master
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "Not a version tag: building unsigned workflow artifacts only."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$TAG points at $GITHUB_SHA, which is not on master; tag a commit on master"
            exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
      # CI installs exactly the SDK engine/global.json names, and the server and the host carry that SDK's .NET
      # runtime and ASP.NET Core. A release does not ship last month's: servicing releases are mostly security fixes,
      # and the server listens on the network (docs/10-releases.md, "The .NET runtime in a release").
      - name: The .NET SDK is the current servicing release
        run: .github/actions/setup-dotnet/sdk-is-current.sh

  # The Linux engine (the NativeAOT host, the server and the native shims), linked on the oldest system the Linux
  # packages run on: the host and the shims bind to the C library they are linked against, and Debian 12's is glibc
  # 2.36. The job runs in a Debian 12 container on a runner of each CPU, and hands the engine to the `headless` job and
  # to the Linux leg of `desktop` as an artifact (a tar file: an artifact does not keep the executable bit).
  #
  # The image is pinned by digest, as the actions are by commit. To update it, take the digest of the `12` tag from
  # https://hub.docker.com/_/debian/tags (the multi-platform one). What the build needs from the system comes from
  # Debian's own packages: CMake 3.25 (engine/native wants 3.24), GCC 12 (C++20) and Clang for NativeAOT's link.
  linux-engine:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: linux-x64 }
          - { os: ubuntu-24.04-arm, name: linux-arm64 }
    runs-on: ${{ matrix.os }}
    container: debian:12@sha256:268fb24c39bca92d326dd83ea3abebe4a3f7751c804ffef23bb6d857dd343ff8
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      # git before the checkout, so that it is a clone (native/build.sh fetches NeuralAmpModelerCore with git too).
      # libicu and ca-certificates are for the .NET SDK; zlib1g-dev and clang for NativeAOT; binutils for objdump.
      - name: Build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential cmake clang zlib1g-dev libasound2-dev libicu72 binutils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Not ./.github/actions/setup-dotnet: its cache of the SDK is keyed by the runner, and holds the SDK under the
      # runner's home folder, which is another path in a container. The same committed install script, uncached.
      - name: Set up .NET
        run: |
          bash .github/actions/setup-dotnet/dotnet-install.sh --jsonfile engine/global.json \
            --install-dir "$HOME/.dotnet-sdk" --azure-feed https://builds.dotnet.microsoft.com/dotnet
          echo "DOTNET_ROOT=$HOME/.dotnet-sdk" >> "$GITHUB_ENV"
          echo "$HOME/.dotnet-sdk" >> "$GITHUB_PATH"
      - name: Cache native dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engine/artifacts/deps
          key: native-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('engine/native/cth_nam/CMakeLists.txt', 'engine/native/cth_audio/CMakeLists.txt') }}
      # The script needs Node and nothing from node_modules.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build the engine
        run: node editor/apps/desktop/scripts/publish-engine.mjs
      # The minimum system the README, docs/10 and the manual name: glibc 2.36, this container's. The NAM shim
      # carries its own C++ runtime, so no libstdc++ version comes on top.
      - name: The C library it needs
        working-directory: editor/dist/engine
        run: |
          "$GITHUB_WORKSPACE/packaging/glibc-floor.sh" 2.36 cathode-host libcth_audio.so libcth_nam.so
          if objdump -p libcth_nam.so | grep -E 'NEEDED +lib(stdc\+\+|gcc_s)'; then
            echo "::error::libcth_nam.so needs the system's C++ runtime; it should carry its own"
            exit 1
          fi
      - name: It runs on Debian 12
        working-directory: editor/dist/engine
        run: |
          ./cathode-host --version
          ./cathode-host --self-test
      - name: Pack it
        run: tar -C editor/dist -cf "engine-${{ matrix.name }}.tar" engine
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-${{ matrix.name }}
          path: engine-${{ matrix.name }}.tar
          if-no-files-found: error
          retention-days: 1 # only the jobs below read it

  desktop:
    # linux-engine: the Linux leg packages the engine built there. The other legs wait for it too, a few minutes.
    needs: [tag, linux-engine]
    # The signing secrets belong in this environment (see the top of this file). A manual run uses no environment.
    environment: ${{ needs.tag.outputs.release == 'true' && 'release' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: macos-arm64 }
          - { os: windows-latest, name: windows-x64 }
          # Packages the engine from linux-engine (glibc 2.36 and newer); only Electron comes from this runner.
          - { os: ubuntu-24.04, name: linux-x64 }
          # The extra targets (docs/10-releases.md, "Desktop targets"): built and tested like the three above, but a
          # leg that fails does not fail the release, which is then published without that target's files.
          - { os: macos-15-intel, name: macos-x64, extra: true }
          - { os: windows-11-arm, name: windows-arm64, extra: true }
          - { os: ubuntu-24.04-arm, name: linux-arm64, extra: true }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.extra || false }}
    timeout-minutes: 60 # notarisation waits on Apple
    permissions:
      contents: read
      id-token: write # the Sigstore certificate that signs the provenance attestation
      attestations: write
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-dotnet
      - name: Cache native dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engine/artifacts/deps
          key: native-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('engine/native/cth_nam/CMakeLists.txt', 'engine/native/cth_audio/CMakeLists.txt') }}
      - name: Linux audio headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: editor/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: editor/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: The engine linked on Debian 12
        if: runner.os == 'Linux'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: engine-${{ matrix.name }}
          path: ${{ runner.temp }}/engine
      - name: Put it where the packaging looks for it
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          tar -C dist -xf "$RUNNER_TEMP/engine/engine-${{ matrix.name }}.tar"
          echo "CATHODE_ENGINE_PREBUILT=1" >> "$GITHUB_ENV"
      - name: Build and package
        shell: bash
        env:
          # Only a release run signs: a manual run builds whatever branch it was started on.
          CSC_LINK: ${{ needs.tag.outputs.release == 'true' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ needs.tag.outputs.release == 'true' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ needs.tag.outputs.release == 'true' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ needs.tag.outputs.release == 'true' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ needs.tag.outputs.release == 'true' && secrets.APPLE_TEAM_ID || '' }}
          # Without a certificate, do not let electron-builder pick one up from the runner's keychain.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ needs.tag.outputs.release == 'true' && secrets.CSC_LINK != '' }}
          # "Name <name@host>": with it Linux also gets a .deb (package.mjs); without it, the AppImage only.
          CATHODE_DEB_MAINTAINER: ${{ vars.CATHODE_DEB_MAINTAINER }}
        run: pnpm dist
      - name: The C library the Linux engine needs
        if: runner.os == 'Linux'
        working-directory: editor/dist/engine
        run: |
          "$GITHUB_WORKSPACE/packaging/glibc-floor.sh" 2.36 cathode-host libcth_audio.so libcth_nam.so
      # The app as packaged, started from where electron-builder left it unpacked beside the installers: it runs the
      # engine it carries (resources/engine), serves its own editor and stops cleanly, and the sidecar tests pass
      # against it on this OS. editor.yml runs those tests on Linux only, against a development build.
      - name: Linux libraries for Electron
        if: runner.os == 'Linux'
        run: pnpm exec playwright install-deps chromium
      - name: The packaged app starts and stops its engine (Playwright)
        shell: bash
        env:
          CATHODE_PACKAGED: "1"
        run: |
          run=(pnpm exec playwright test --config apps/desktop/e2e/playwright.config.ts packaged.spec.ts sidecars.spec.ts)
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run --auto-servernum "${run[@]}"; else "${run[@]}"; fi
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packaged-e2e-${{ matrix.name }}
          path: editor/dist/e2e-*
      # Hashed here, where they were built: the release job checks what it downloads against these and publishes
      # them as SHA256SUMS. "<sha256>  <name>" per line (Git Bash marks binary mode with "*"; that is dropped).
      - name: Checksums
        shell: bash
        working-directory: editor/dist/release
        env:
          SUMS: SHA256SUMS.desktop-${{ matrix.name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(*.dmg *.zip *.exe *.AppImage *.deb)
          if [ "${#files[@]}" = 0 ]; then echo "::error::no installers in editor/dist/release"; exit 1; fi
          if command -v sha256sum > /dev/null; then hash=(sha256sum); else hash=(shasum -a 256); fi
          "${hash[@]}" -- "${files[@]}" | sed -E 's/^([0-9a-f]{64}) [ *]/\1  /' > "$SUMS"
          cat "$SUMS"
      # Release runs only: an attestation says "built by this repository's release.yml", and a manual run builds any
      # branch.
      - name: Provenance
        if: needs.tag.outputs.release == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: editor/dist/release/SHA256SUMS.desktop-${{ matrix.name }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.name }}
          path: |
            editor/dist/release/*.dmg
            editor/dist/release/*.zip
            editor/dist/release/*.exe
            editor/dist/release/*.AppImage
            editor/dist/release/*.deb
            editor/dist/release/SHA256SUMS.desktop-${{ matrix.name }}
          if-no-files-found: error

  headless:
    needs: [tag, linux-engine]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: linux-x64 }
          - { os: ubuntu-24.04-arm, name: linux-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # the Sigstore certificate that signs the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Nothing .NET is built here (the engine comes from linux-engine); the SDK is for dotnet-stack, should the
      # server not start below.
      - uses: ./.github/actions/setup-dotnet
      - name: The ALSA library
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: editor/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: editor/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: editor
      - name: The host's start script
        run: packaging/headless/tests/run-host.test.sh
      - name: The engine linked on Debian 12
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: engine-${{ matrix.name }}
          path: ${{ runner.temp }}/engine
      - name: Build the package
        env:
          CATHODE_ENGINE_PREBUILT: "1"
        run: |
          mkdir -p editor/dist
          tar -C editor/dist -xf "$RUNNER_TEMP/engine/engine-${{ matrix.name }}.tar"
          packaging/headless/build.sh
      # The minimum system the README, docs/10 and the manual name: glibc 2.36, Debian 12's, where the engine in the
      # package was linked. Checked again here, on what is shipped; the NAM shim carries its own C++ runtime.
      - name: The C library it needs
        run: |
          cd dist/headless/cathode-server-*/bin
          "$GITHUB_WORKSPACE/packaging/glibc-floor.sh" 2.36 cathode-host libcth_audio.so libcth_nam.so
          if objdump -p libcth_nam.so | grep -E 'NEEDED +lib(stdc\+\+|gcc_s)'; then
            echo "::error::libcth_nam.so needs the system's C++ runtime; it should carry its own"
            exit 1
          fi
      - name: Install it and check it runs
        run: |
          package=$(ls dist/headless/*.tar.gz)
          mkdir -p /tmp/cathode && tar -C /tmp/cathode -xzf "$package"
          cd /tmp/cathode/cathode-server-*
          ./bin/cathode-host --self-test
          sudo ./install.sh
          # Channel options as cathode.env.example writes them, input map included: its ";" must reach the host
          # inside the option (it once ended the start script's command, and the host restarted for ever).
          sudo sed -i 's/^CATHODE_HOST_ARGS=.*/CATHODE_HOST_ARGS=--input-map 1;2 --outputs 1,3,0,0/' /etc/cathode/cathode.env
          sudo systemctl restart cathode-host cathode-server
          token=$(sudo sed -n 's/^Cathode__Token=//p' /etc/cathode/cathode.env)
          # A minute at most: it starts in seconds, and unpacks itself on its first start. A slow start fails here.
          for i in $(seq 1 30); do
            curl -fs -H "Authorization: Bearer $token" http://127.0.0.1:5180/api/v1/system > /tmp/system.json && break
            if [ "$i" = 10 ]; then
              # Not up after 20 s, when it starts in a few: show where it waits.
              echo "The server has not answered in 20 s; its threads:"
              dotnet tool install --tool-path /tmp/tools dotnet-stack > /dev/null
              sudo /tmp/tools/dotnet-stack report -p "$(pgrep -x cathode-server)" || true
            fi
            sleep 2
          done
          echo "The server answered after about $((i * 2)) s."
          cat /tmp/system.json
          grep -q '"connected":true' /tmp/system.json
          sudo cat "/proc/$(pgrep -x cathode-host)/cmdline" | tr '\0' ' ' | grep -F -- '--input-map 1;2 --outputs 1,3,0,0'
          curl -fs http://127.0.0.1:5180/ | grep -q 'name="cathode-server" content="same-origin"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5180/api/v1/system)" = 401
          sudo ./uninstall.sh --purge
          # A purge leaves nothing: not the settings, the data, the server's unpacked bundle or the socket folder.
          for left in /opt/cathode /etc/cathode /var/lib/cathode /var/cache/cathode /run/cathode; do
            if [ -e "$left" ]; then echo "::error::uninstall.sh --purge left $left"; exit 1; fi
          done
      - if: failure()
        run: |
          sudo systemctl status cathode-host cathode-server --no-pager || true
          sudo journalctl -u cathode-host -u cathode-server --no-pager | tail -150
      - name: Checksums
        working-directory: dist/headless
        env:
          SUMS: SHA256SUMS.headless-${{ matrix.name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(*.tar.gz)
          if [ "${#files[@]}" = 0 ]; then echo "::error::no package in dist/headless"; exit 1; fi
          sha256sum -- "${files[@]}" > "$SUMS"
          cat "$SUMS"
      - name: Provenance
        if: needs.tag.outputs.release == 'true' # as for the desktop builds
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/headless/SHA256SUMS.headless-${{ matrix.name }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: headless-${{ matrix.name }}
          path: |
            dist/headless/*.tar.gz
            dist/headless/SHA256SUMS.headless-${{ matrix.name }}
          if-no-files-found: error

  release:
    if: needs.tag.outputs.release == 'true'
    needs: [engine, editor, tag, desktop, headless]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # creates the release
      id-token: write # the Sigstore certificate that signs the attestation of SHA256SUMS
      attestations: write
    steps:
      # The installers and their checksums, not the engine-linux-* artifacts the build jobs passed between them.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: headless-*
          path: release
          merge-multiple: true
      # SHA256SUMS is the build jobs' own checksums, merged, after checking that every downloaded file still has the
      # hash it had where it was built, and that nothing without one would be published.
      - name: Checksums
        working-directory: release
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(SHA256SUMS.*)
          if [ "${#parts[@]}" = 0 ]; then echo "::error::the build jobs left no checksums"; exit 1; fi
          sha256sum --strict --check -- "${parts[@]}"
          cat -- "${parts[@]}" > SHA256SUMS
          rm -- "${parts[@]}"
          listed=$(cut -c67- SHA256SUMS)
          for file in *; do
            if [ "$file" != SHA256SUMS ] && ! grep -Fxq -- "$file" <<< "$listed"; then
              echo "::error::$file has no checksum from the job that built it"
              exit 1
            fi
          done
          cat SHA256SUMS
      # Signed (keyless, Sigstore) provenance for SHA256SUMS too, which vouches for every line in it. The bundle is
      # published beside it for verifying without the attestations API (docs/10-releases.md, "Verifying a download").
      - name: Provenance of SHA256SUMS
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/SHA256SUMS
      - name: Keep the attestation bundle beside SHA256SUMS
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp -- "$BUNDLE" release/SHA256SUMS.sigstore.json
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          flags=(--generate-notes)
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" release/* --repo "$REPO" "${flags[@]}"
