name: nightly

# The checks too slow or too specialised for every push (docs/03-testing-strategy.md):
#
# - Parameter fuzzing (§3): every property-based test (CsCheck, trait Category=Property) runs for a fixed time per
#   case instead of its fixed number of cases: for every registered block, random parameter vectors, an instant jump
#   of all of them mid-stream and four stimuli, with no NaN, no infinity and no blow-up allowed; and the convolver's
#   linearity. A failure prints the CsCheck seed that reproduces it (CsCheck_Seed).
# - RealtimeSanitizer (§6): engine/native built with Clang 20 and cth_rtsan_check run on it. Every .nam model goes
#   through cth_nam_process, and a stream runs on ALSA's "null" PCM with a model in its callback, all in RTSan's
#   real-time context, which aborts on any allocation, lock or blocking call there. Two canaries first prove the check
#   is armed. Pull requests that touch the native code run this job too.
# - Multi-rate (§3): every Circuit Amp model at 88.2, 96 and 192 kHz against its own sound at 48 kHz (level and octave
#   bands; CATHODE_MULTIRATE_FULL=1). Every build already runs every block at every rate and the models at 44.1 kHz.
# - Capture matches (docs/06 §4.3): `cathode-references fetch` downloads the redistributable (GPL) amp captures named
#   in engine/tests/assets/references/manifest.json into a cache kept between runs (keyed on the manifest, which holds
#   every URL and SHA-256), and Cathode.References.Tests holds each circuit amp to the manifest's ESR / MRSTFT targets.
#   CATHODE_REFERENCES_REQUIRED=1 makes a missing redistributable capture fail instead of skip; the local-only (T3K)
#   captures cannot be fetched by script and still skip, and the job summary counts them. Too slow for every push
#   (each case renders the circuit amp for several seconds of audio); pull requests that touch the native code (NAM
#   runs through cth_nam) run it too.

on:
  schedule:
    - cron: "41 3 * * *" # nightly, 03:41 UTC (after the soak)
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds each property-based test case runs (CsCheck_Time)
        default: "60"
        required: true
  pull_request:
    paths: ["engine/native/**", ".github/workflows/nightly.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: engine

jobs:
  fuzz:
    name: parameter fuzzing
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120 # about 50 cases at 60 s each
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-dotnet
      - name: Cache native dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engine/artifacts/deps
          key: native-deps-${{ hashFiles('engine/native/cth_nam/CMakeLists.txt', 'engine/native/cth_audio/CMakeLists.txt') }}
      - name: Install ALSA headers
        run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev
      - name: Build native shim
        run: ./native/build.sh
      - run: dotnet build tests/Cathode.Dsp.Tests -c Release
      # CsCheck_Time overrides each test's iteration count: the sample runs that many seconds on every core.
      - name: Property-based tests, run for a fixed time each
        env:
          CsCheck_Time: ${{ inputs.seconds || '60' }}
        run: dotnet test --project tests/Cathode.Dsp.Tests -c Release --no-build --filter-trait "Category=Property"

  multirate:
    name: amp models at every sample rate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-dotnet
      - run: dotnet build tests/Cathode.Dsp.Tests -c Release
      # Every build checks every block at every rate and the amp models at 44.1 kHz; this adds the models at 88.2, 96
      # and 192 kHz, which take a few minutes.
      - name: Multi-rate tests, amp models included
        env:
          CATHODE_MULTIRATE_FULL: "1"
        run: >-
          dotnet test --project tests/Cathode.Dsp.Tests -c Release --no-build
          --filter-class Cathode.Dsp.Tests.MultiRateTests

  references:
    name: capture matches (references)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CATHODE_REFERENCES_REQUIRED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-dotnet
      - name: Cache native dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engine/artifacts/deps
          key: native-deps-${{ hashFiles('engine/native/cth_nam/CMakeLists.txt', 'engine/native/cth_audio/CMakeLists.txt') }}
      - name: Cache the reference captures
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/cathode/references # the harness's default cache ($CATHODE_REFERENCES unset)
          key: references-${{ hashFiles('engine/tests/assets/references/manifest.json') }}
          restore-keys: references-
      - name: Install ALSA headers
        run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev
      # NAM captures run through cth_nam; without it they would fail (CATHODE_REFERENCES_REQUIRED).
      - name: Build native shim
        run: ./native/build.sh
      - run: dotnet build tools/Cathode.References -c Release
      - run: dotnet build tests/Cathode.References.Tests -c Release
      # Verifies what the cache restored against the manifest's SHA-256 and downloads anything missing or changed.
      - name: Fetch the redistributable captures
        run: dotnet run --project tools/Cathode.References -c Release --no-build -- fetch
      - name: Capture-match tests
        run: |
          set -o pipefail
          dotnet test --project tests/Cathode.References.Tests -c Release --no-build 2>&1 | tee "$RUNNER_TEMP/references.log"
      - name: Summary
        if: always()
        run: |
          log="$RUNNER_TEMP/references.log"
          status=$(dotnet run --project tools/Cathode.References -c Release --no-build -- status 2>/dev/null || true)
          verified=$(grep -cE ' Verified$' <<< "$status" || true)
          missing=$(grep -cE ' Missing$' <<< "$status" || true)
          skipped=$(grep -c '^skipped Cathode.References.Tests.ReferenceMatchTests' "$log" 2>/dev/null || true)
          {
            echo "### Capture matches"
            echo
            echo "- References in the cache: $verified verified, $missing missing (local-only T3K captures are fetched by hand and never in CI)"
            echo "- Capture-match cases skipped: $skipped (each a local-only capture; a missing redistributable one fails)"
            echo
            echo '```'
            grep -E '^\s*(total|failed|succeeded|skipped):' "$log" 2>/dev/null || echo "the tests did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  rtsan:
    name: RealtimeSanitizer (native)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang-20
      CXX: clang++-20
      RTSAN_OPTIONS: halt_on_error=true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache native dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engine/artifacts/deps
          key: native-deps-${{ hashFiles('engine/native/cth_nam/CMakeLists.txt', 'engine/native/cth_audio/CMakeLists.txt') }}
      - name: Install Clang 20 (RealtimeSanitizer's first release) and ALSA headers
        run: sudo apt-get update -q && sudo apt-get install -y -q clang-20 libclang-rt-20-dev libasound2-dev
      # Its own build tree and output folder: these libraries are for this check only.
      - name: Build with RealtimeSanitizer
        env:
          CTH_NATIVE_BUILD_DIR: ${{ github.workspace }}/engine/artifacts/obj/native-rtsan
        run: ./native/build.sh -DCTH_RTSAN=ON "-DCTH_ARTIFACTS_DIR=$GITHUB_WORKSPACE/engine/artifacts/native-rtsan"
      - name: The canaries are caught (the check is armed)
        run: |
          set -uo pipefail
          for canary in canary-direct canary-shim; do
            status=0
            artifacts/native-rtsan/cth_rtsan_check artifacts/native-rtsan/nam-models "$canary" \
              > "$RUNNER_TEMP/$canary.log" 2>&1 || status=$?
            cat "$RUNNER_TEMP/$canary.log"
            if [ "$status" = 0 ] || ! grep -q RealtimeSanitizer "$RUNNER_TEMP/$canary.log"; then
              echo "::error::$canary was not caught by RealtimeSanitizer (exit $status): the check is not armed"
              exit 1
            fi
          done
      - name: The real-time paths of cth_nam and cth_audio are clean
        run: artifacts/native-rtsan/cth_rtsan_check artifacts/native-rtsan/nam-models
