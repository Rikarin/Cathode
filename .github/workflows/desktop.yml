name: desktop

# Builds the desktop app (`pnpm dist`: the editor, Electron and the engine sidecars) on each OS, since NativeAOT cannot
# cross-compile: a .dmg and .zip for Apple Silicon Macs, an NSIS installer for Windows x64 and an AppImage for Linux
# x64, and uploads them as workflow artifacts. Before that it starts the packaged app on its runner and runs the
# packaged-app and sidecar Playwright tests against it. Version tags are built and released by release.yml.
#
# It runs on every push to master that touches the editor or the engine, and on a pull request that changes what only
# packaging exercises: the desktop app's main process and its packaging scripts, the native build, the .NET setup
# action, or this file.
#
# Signing is optional. Without secrets, macOS builds are signed ad hoc (Gatekeeper asks users to allow them) and Windows
# builds are unsigned. Set CSC_LINK (base64 .p12) and CSC_KEY_PASSWORD to sign, and on macOS APPLE_ID,
# APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID to notarise. Only a build of master is given them: a pull request, or
# a manual run on another branch, builds code that has not been reviewed and is packaged unsigned.

on:
  push:
    branches: [master]
    paths: ["editor/**", "engine/**", ".github/actions/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths:
      - "editor/apps/desktop/**"
      - "engine/native/**"
      - ".github/actions/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run it supersedes. Every other run (master, a tag, a manual run) has
# a group of its own, so it is never cancelled or left waiting.
concurrency:
  group: desktop-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: macos-arm64 }
          - { os: windows-latest, name: windows-x64 }
          - { os: ubuntu-latest, name: linux-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-dotnet
      - name: Cache native dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engine/artifacts/deps
          key: native-deps-${{ hashFiles('engine/native/cth_nam/CMakeLists.txt', 'engine/native/cth_audio/CMakeLists.txt') }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: editor/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: editor/pnpm-lock.yaml
      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev
      - run: pnpm install --frozen-lockfile
      - name: Build and package
        shell: bash
        env:
          CATHODE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          CSC_LINK: ${{ github.ref == 'refs/heads/master' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ github.ref == 'refs/heads/master' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ github.ref == 'refs/heads/master' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ github.ref == 'refs/heads/master' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ github.ref == 'refs/heads/master' && secrets.APPLE_TEAM_ID || '' }}
          # Without a certificate, do not let electron-builder pick one up from the runner's keychain.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ github.ref == 'refs/heads/master' && secrets.CSC_LINK != '' }}
        run: pnpm dist
      # The app as packaged, started from where electron-builder left it unpacked beside the installers: it runs the
      # engine it carries (resources/engine), serves its own editor and stops cleanly, and the sidecar tests pass
      # against it on this OS. editor.yml runs those tests on Linux only, against a development build.
      - name: Linux libraries for Electron
        if: runner.os == 'Linux'
        run: pnpm exec playwright install-deps chromium
      - name: The packaged app starts and stops its engine (Playwright)
        shell: bash
        env:
          CATHODE_PACKAGED: "1"
        run: |
          run=(pnpm exec playwright test --config apps/desktop/e2e/playwright.config.ts packaged.spec.ts sidecars.spec.ts)
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run --auto-servernum "${run[@]}"; else "${run[@]}"; fi
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packaged-e2e-${{ matrix.name }}
          path: editor/dist/e2e-*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cathode-${{ matrix.name }}
          path: |
            editor/dist/release/*.dmg
            editor/dist/release/*.zip
            editor/dist/release/*.exe
            editor/dist/release/*.AppImage
          if-no-files-found: error
